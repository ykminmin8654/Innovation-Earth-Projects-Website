<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading… — Innovation Earth Projects</title>
  <meta name="robots" content="noindex" />

  <style>
    :root {
      --teal: #008080;
      --teal-deep: #005F5F;
      --ink: #0B1A1F;
      --muted: #6A8085;
      --bg: #F8FBFC;
      --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
    }
    .loader { max-width: 420px; }
    .loader__mark {
      display: inline-flex;
      color: var(--teal);
      margin-bottom: 1.5rem;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .loader__title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
      color: var(--teal-deep);
    }
    .loader__sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0 0 1.5rem;
    }
    .loader__link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--teal);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s ease;
    }
    .loader__link:hover { background: var(--teal-deep); }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.08); opacity: 0.85; }
    }
  </style>
</head>

<body>
  <div class="loader" id="loader">
    <span class="loader__mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="56" height="56">
        <circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M32 12 L32 52 M12 32 L52 32" stroke="currentColor" stroke-width="3"/>
        <circle cx="32" cy="32" r="8" fill="currentColor"/>
      </svg>
    </span>
    <h1 class="loader__title">Loading…</h1>
    <p class="loader__sub" id="loader-sub">Taking you to the right page.</p>
    <a class="loader__link" id="manual-link" href="/home/index.html">
      Continue <span aria-hidden="true">→</span>
    </a>
  </div>

  <script>
    /* ============================================================
       GitHub Pages 404 shim
       Loads a known section's index.html content directly into
       the current page — URL bar stays at whatever the user
       typed (e.g. /home or /newsletter).
       ============================================================ */

    (function () {
      'use strict';

      // ------------------------------------------------------------
      // Config — sections you want to support at clean URLs
      // ------------------------------------------------------------
      var SECTIONS = {
        'home':       '/home/index.html',
        'products':   '/products/index.html',
        'newsletter': '/newsletter/index.html'
        // Add more as you build them:
        // 'studio':  '/studio/index.html',
        // 'aboutus': '/aboutus/index.html',
        // 'contact': '/contact/index.html'
      };

      // ------------------------------------------------------------
      // Parse current URL
      // ------------------------------------------------------------
      var pathname = window.location.pathname;
      var search   = window.location.search || '';
      var hash     = window.location.hash   || '';

      // Remove leading/trailing slashes and split
      var cleaned  = pathname.replace(/^\/+|\/+$/g, '');
      var segments = cleaned.split('/').filter(Boolean);

      var subEl = document.getElementById('loader-sub');
      var manualLink = document.getElementById('manual-link');

      // ------------------------------------------------------------
      // Root path → home
      // ------------------------------------------------------------
      if (segments.length === 0) {
        window.location.replace('/home/');
        return;
      }

      var section = segments[0].toLowerCase();
      var target = SECTIONS[section];

      // ------------------------------------------------------------
      // Unknown section → home
      // ------------------------------------------------------------
      if (!target) {
        if (subEl) subEl.textContent = 'Page not found — going home.';
        manualLink.href = '/home/';
        setTimeout(function () {
          window.location.replace('/home/');
        }, 800);
        return;
      }

      // ------------------------------------------------------------
      // Build the URL to fetch
      // If user typed /newsletter/post.html?id=foo — respect the full path
      // Otherwise, use the section's index.html
      // ------------------------------------------------------------
      var rest = segments.slice(1).join('/');
      var fetchUrl;
      if (rest && /\.\w+$/.test(rest)) {
        // Direct file reference: /newsletter/post.html
        fetchUrl = '/' + section + '/' + rest + search;
      } else {
        // Folder: /newsletter → serve index.html
        fetchUrl = target + search;
      }

      // ------------------------------------------------------------
      // Fetch the target HTML and inject it
      // ------------------------------------------------------------
      fetch(fetchUrl, { credentials: 'same-origin' })
        .then(function (res) {
          if (!res.ok) throw new Error('Not found');
          return res.text();
        })
        .then(function (html) {
          // Parse the fetched document
          var parser = new DOMParser();
          var doc = parser.parseFromString(html, 'text/html');

          // ----- Replace <title> -----
          if (doc.title) document.title = doc.title;

          // ----- Copy <head> contents (styles, scripts, meta) -----
          // Remove existing head elements we're going to replace
          document.head.querySelectorAll('link[rel="stylesheet"], style').forEach(function (el) {
            // Keep our shim styles so we don't flash unstyled
            if (el.id !== 'shim-styles') el.remove();
          });

          // Add fetched head elements (stylesheet links + inline styles)
          doc.head.querySelectorAll('link[rel="stylesheet"], style').forEach(function (el) {
            document.head.appendChild(el.cloneNode(true));
          });

          // Copy meta tags
          doc.head.querySelectorAll('meta[name], meta[property]').forEach(function (el) {
            document.head.appendChild(el.cloneNode(true));
          });

          // ----- Replace <body> content -----
          var newBody = doc.body.cloneNode(true);

          // Copy body attributes (data-page, class, etc.)
          Array.from(doc.body.attributes).forEach(function (attr) {
            document.body.setAttribute(attr.name, attr.value);
          });

          // Replace body contents
          document.body.innerHTML = newBody.innerHTML;

          // ------------------------------------------------------------
          // Re-execute scripts from the fetched document
          // ------------------------------------------------------------
          // Any <script> in the fetched body needs to run again
          var scripts = doc.querySelectorAll('script');
          scripts.forEach(function (oldScript) {
            var newScript = document.createElement('script');
            Array.from(oldScript.attributes).forEach(function (attr) {
              newScript.setAttribute(attr.name, attr.value);
            });
            newScript.textContent = oldScript.textContent;
            document.body.appendChild(newScript);
          });

          // ------------------------------------------------------------
          // Restore the URL bar to what the user typed
          // ------------------------------------------------------------
          // The URL never actually changed — GitHub served 404.html
          // at the requested path. So the URL bar is already correct.
          // Nothing to do here.
        })
        .catch(function (err) {
          console.error('Failed to load section:', err);
          if (subEl) subEl.textContent = 'Could not load that page — going home.';
          setTimeout(function () {
            window.location.replace('/home/');
          }, 800);
        });

    })();
  </script>
</body>
</html>
