<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading… — Innovation Earth Projects</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --teal: #008080;
      --teal-deep: #005F5F;
      --ink: #0B1A1F;
      --muted: #6A8085;
      --bg: #F8FBFC;
      --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
    }
    .loader { max-width: 420px; }
    .loader__mark {
      display: inline-flex;
      color: var(--teal);
      margin-bottom: 1.5rem;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .loader__title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.5rem;
      color: var(--teal-deep);
    }
    .loader__sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0 0 1.5rem;
    }
    .loader__link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--teal);
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: background 0.2s ease;
    }
    .loader__link:hover { background: var(--teal-deep); }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.08); opacity: 0.85; }
    }
  </style>
  <link rel="icon" type="image/png" href="/images/logo.png" />
</head>

<body>
  <div class="loader" id="loader">
    <span class="loader__mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="56" height="56">
        <circle cx="32" cy="32" r="28" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M32 12 L32 52 M12 32 L52 32" stroke="currentColor" stroke-width="3"/>
        <circle cx="32" cy="32" r="8" fill="currentColor"/>
      </svg>
    </span>
    <h1 class="loader__title">Loading…</h1>
    <p class="loader__sub" id="loader-sub">Taking you to the right page.</p>
    <a class="loader__link" id="manual-link" href="/home">
      Continue <span aria-hidden="true">→</span>
    </a>
  </div>

  <script>
    /* ============================================================
       GitHub Pages 404 shim — clean URL support
       ============================================================ */
    (function () {
      'use strict';

      /* ------------------------------------------------------------
         Config — sections that support clean URLs
         ------------------------------------------------------------ */
      var SECTIONS = {
        'home':     '/home/index.html',
        'about':    '/about/index.html',
        'products': '/products/index.html',
        'contact':  '/contact/index.html',
        'legal':    '/legal/index.html'
      };

      var pathname = window.location.pathname;
      var search   = window.location.search || '';
      var hash     = window.location.hash   || '';

      var cleaned  = pathname.replace(/^\/+|\/+$/g, '');
      var segments = cleaned.split('/').filter(Boolean);

      // Section names that must ALWAYS land on their real index.html via a
      // full redirect instead of SPA injection:
      //   - 'legal': its tabs are driven by #privacy / #tos deep links. The
      //     shim injects content without changing location.hash, so both
      //     footer links would render the identical default screen. A hard
      //     redirect lets legal.js read the hash and pick the right tab.
      //   - any section whose index.html exists but whose edge-cached 404
      //     served us this shim anyway (fresh deploys): redirecting is safer
      //     than injecting when the caller passed a #hash.
      var HARD_REDIRECT = {};

      // /legal/privacy and /legal/tos are clean URLs for the two legal docs.
      // Forward to the real page with ?doc=<name> so legal.js opens the right
      // tab — no hash ever appears in the address bar. (The site's nav shim
      // also routes these client-side; this covers direct hits & refreshes.)
      if (segments[0].toLowerCase() === 'legal' && segments.length === 2) {
        var docSeg = segments[1].toLowerCase().replace(/\.html?$/, '');
        if (/^privacy/.test(docSeg)) { location.replace('/legal/?doc=privacy'); return; }
        if (docSeg === 'tos' || /^terms/.test(docSeg)) { location.replace('/legal/?doc=tos'); return; }
      }
      if (segments.length === 1 && SECTIONS[segments[0].toLowerCase()]) {
        var secKey = segments[0].toLowerCase();
        if (HARD_REDIRECT[secKey] || hash) {
          window.location.replace(SECTIONS[secKey] + search + hash);
          return;
        }
      }

      var subEl = document.getElementById('loader-sub');
      var manualLink = document.getElementById('manual-link');

      // ------------------------------------------------------------
      // Root → home
      // ------------------------------------------------------------
      if (segments.length === 0) {
        window.location.replace('/home');
        return;
      }

      var section = segments[0].toLowerCase();
      var target = SECTIONS[section];

      // ------------------------------------------------------------
      // Unknown section → home
      // ------------------------------------------------------------
      if (!target) {
        if (subEl) subEl.textContent = 'Page not found — going home.';
        manualLink.href = '/home';
        setTimeout(function () {
          window.location.replace('/home');
        }, 800);
        return;
      }

      // ------------------------------------------------------------
      // Build fetch URL
      // ------------------------------------------------------------
      var rest = segments.slice(1).join('/');
      var fetchUrl;
      if (rest && /\.\w+$/.test(rest)) {
        // e.g. /products/detail.html?id=foo
        fetchUrl = '/' + section + '/' + rest + search;
      } else {
        fetchUrl = target + search;
      }

      // ------------------------------------------------------------
      // Fetch and inject
      // ------------------------------------------------------------
      fetch(fetchUrl, { credentials: 'same-origin' })
        .then(function (res) {
          if (!res.ok) throw new Error('Not found');
          return res.text();
        })
        .then(function (html) {
          var parser = new DOMParser();
          var doc = parser.parseFromString(html, 'text/html');

          // ----- Set <base> tag so relative paths resolve correctly -----
          var base = document.createElement('base');
          base.href = '/' + section + '/';
          document.head.appendChild(base);

          // ----- Title -----
          if (doc.title) document.title = doc.title;

          // ----- Copy <head> styles and scripts (link, style) -----
          doc.head.querySelectorAll('link[rel="stylesheet"], style').forEach(function (el) {
            if (el.id === 'shim-styles') return;
            document.head.appendChild(el.cloneNode(true));
          });

          // ----- Copy meta tags -----
          doc.head.querySelectorAll('meta[name], meta[property]').forEach(function (el) {
            document.head.appendChild(el.cloneNode(true));
          });

          // ----- Copy body attributes -----
          Array.from(doc.body.attributes).forEach(function (attr) {
            document.body.setAttribute(attr.name, attr.value);
          });

          // ----- Replace body content -----
          var newBody = doc.body.cloneNode(true);

          // Strip <script> tags from the clone (we'll re-add them properly)
          newBody.querySelectorAll('script').forEach(function (s) {
            s.remove();
          });

          document.body.innerHTML = newBody.innerHTML;

          // ----- Re-execute scripts in order -----
          doc.querySelectorAll('script').forEach(function (oldScript) {
            var newScript = document.createElement('script');
            Array.from(oldScript.attributes).forEach(function (attr) {
              newScript.setAttribute(attr.name, attr.value);
            });
            newScript.textContent = oldScript.textContent;
            document.body.appendChild(newScript);
          });

          // ----- Notify listeners (nav.js, script.js, etc.) -----
          window.dispatchEvent(new Event('shim:content-loaded'));
        })
        .catch(function (err) {
          console.error('Failed to load section:', err);
          if (subEl) subEl.textContent = 'Could not load that page — going home.';
          setTimeout(function () {
            window.location.replace('/home');
          }, 800);
        });

    })();
  </script>
</body>
</html>
