backend:
  name: github
  repo: ykminmin8654/Innovation-Earth-Projects-Website
  branch: main
  base_url: https://decap-proxy.ykminmin8654.workers.dev
  auth_endpoint: /auth

media_folder: "products/images"
public_folder: "/products/images"

collections:
  - name: products
    label: Products
    label_singular: Product
    description: Tools and products shown on the Products page.
    folder: products/data
    create: true
    slug: "{{slug}}"

    fields:
      - label: Title
        name: title
        widget: string

      - label: Description
        name: description
        widget: text

      - label: Status
        name: status
        widget: select
        default: live
        options:
          - label: Live
            value: live
          - label: Beta
            value: beta
          - label: Coming Soon
            value: soon

      - label: URL
        name: url
        widget: string
        required: false

      - label: Icon
        name: icon
        widget: string
        required: false
        hint: 'Font Awesome class, e.g. fa-rocket'

      - label: Tags
        name: tags
        widget: list
        required: false

      - label: Order
        name: order
        widget: number
        value_type: int
        min: 0
        max: 999
        step: 1
        default: 999

      - label: Updated Date
        name: updatedAt
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
