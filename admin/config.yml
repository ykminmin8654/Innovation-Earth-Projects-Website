backend:
  name: github
  repo: ykminmin8654/Innovation-Earth-Projects-Website
  branch: main
  # Cloudflare Worker OAuth proxy (see worker/products-proxy.js).
  # Decap appends auth_endpoint to base_url, so with these values the
  # login flow hits https://decap-proxy.ykminmin8654.workers.dev/api/v1/github/oauth
  base_url: https://decap-proxy.ykminmin8654.workers.dev/api/v1/github
  auth_endpoint: oauth

media_folder: "products/images"
public_folder: "/products/images"

collections:
  - name: admin
    label: Admin
    label_singular: Entry
    description: Tools and products shown on the Products page.
    folder: products/data
    create: true
    slug: "{{slug}}"

    fields:
      - label: Title
        name: title
        widget: string

      - label: Description
        name: description
        widget: text

      - label: Status
        name: status
        widget: select
        default: live
        options:
          - label: Live
            value: live
          - label: Beta
            value: beta
          - label: Coming Soon
            value: soon

      - label: URL
        name: url
        widget: string
        required: false
        hint: >-
          Full URL where the product lives. You can point one of your own
          site's subdomains at a product here, e.g.
          https://toolname.innovationearthprojects.org — create the CNAME
          record for the subdomain first (see README), then enter the full
          https URL here.

      - label: Subdomain
        name: subdomain
        widget: string
        required: false
        hint: >-
          Optional shorthand for the subdomain this product is hosted on,
          without the domain part (e.g. "studypal" for
          studypal.innovationearthprojects.org). Used only as a note/label.

      - label: Icon
        name: icon
        widget: string
        required: false
        hint: 'Font Awesome class, e.g. fa-rocket'

      - label: Pricing
        name: pricing
        widget: text
        required: false
        default: Free
        hint: >-
          Badge shown on the product card. Leave as "Free" (the default) for
          no-cost tools, or enter any label you like, e.g. "$5/mo",
          "Freemium", "One-time $20".

      - label: Tags
        name: tags
        widget: list
        required: false

      - label: Order
        name: order
        widget: number
        value_type: int
        min: 0
        max: 999
        step: 1
        default: 999

      - label: Updated Date
        name: updatedAt
        widget: datetime
        required: false
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
