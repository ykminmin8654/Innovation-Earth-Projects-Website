<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Innovation Earth Projects</title>
  <meta name="robots" content="noindex" />
  <style>
    body { margin: 0; background: #171b21; }
    #iep-boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #e6e9ee; background: #171b21; text-align: center; padding: 24px;
    }
    #iep-boot img { width: 72px; height: 72px; object-fit: contain; }
    #iep-boot .sub { font-weight: 400; font-size: 13px; color: #9aa4b2; max-width: 420px; }
    #iep-boot code {
      background: #232a33; padding: 2px 6px; border-radius: 4px;
      font-size: 12px; color: #7dd3c0; word-break: break-all;
    }
    #iep-boot a { color: #7dd3c0; }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid #2c333d; border-top-color: #35d0ba;
      animation: iep-spin 0.9s linear infinite;
    }
    @keyframes iep-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
  <script>
    // ---------------------------------------------------------------------
    // OAuth popup shim — fixes the permanent "Completing sign-in…" hang.
    // Decap's github backend opens a popup and waits for a Netlify-style
    // postMessage handshake ("authorizing:github" / "authorization:github:
    // success:{token}") that our Cloudflare Worker callback page never
    // completes reliably. This shim replaces that flow with GitHub's
    // supported *implicit* OAuth flow, which returns the access token in
    // the URL fragment (#access_token=...) — no proxy call needed after
    // login, so it cannot hang. It works entirely on this page:
    //   1. intercepts window.open() of the Worker authorize popup and
    //      redirects the tab to github.com/login/oauth/authorize with
    //      a GitHub-accepted authorize URL (no response_type — GitHub 404s on it);
    //   2. on return, reads #access_token and feeds it back into the CMS
    //      through the exact message Decap's popup listener expects.
    // Requires app_id (your GitHub OAuth App client id) in admin/config.yml.
    // ---------------------------------------------------------------------
    (function () {
      var WORKER_BASE = 'https://decap-proxy.ykminmin8654.workers.dev/api/v1/github';
      // Your GitHub OAuth App Client ID (github.com/settings/developers).
      // Hardcoded here so login works even if config.yml still has a placeholder.
      var FALLBACK_APP_ID = 'Iv23liYfJrQsBnnhUgVp';

      function normalizeAppId(id) {
        id = String(id || '').trim().replace(/^["']+|["']+$/g, '');
        if (!id || /REPLACE_WITH/i.test(id)) return '';
        return id;
      }

      function findAppId() {
        var cfg = window.cms && window.cms.backend && window.cms.backend.config;
        var id = normalizeAppId(cfg && cfg.app_id);
        if (id) return id;
        try {
          var raw = localStorage.getItem('localStorageKey:/config');
          if (raw) {
            var j = JSON.parse(JSON.parse(raw));
            id = normalizeAppId(j.backend && j.backend.app_id);
            if (id) return id;
          }
        } catch (e) {}
        return FALLBACK_APP_ID;
      }

      function startImplicitFlow(appId, scope) {
        // Generate a random CSRF state, persist it, and send it to GitHub.
        // GitHub echoes it back in the redirect (?state=... or #state=...)
        // and the handler below verifies it before delivering the token.
        // Without state, some browsers/extensions block the redirect and
        // the login appears to do nothing.
        var nonce = '';
        try {
          var buf = new Uint8Array(16);
          (window.crypto || window.msCrypto).getRandomValues(buf);
          nonce = Array.prototype.map.call(buf, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
        } catch (e) { nonce = String(Date.now()) + Math.random().toString(36).slice(2); }
        try { sessionStorage.setItem('iep-oauth-state', nonce); } catch (e) {}
        var redirect = location.origin + location.pathname; // /admin/ — must match the OAuth App's registered callback URL exactly
        // NOTE: GitHub returns a 404 ("Sorry about that…") for ANY authorize
        // URL that includes a response_type parameter — so we never send one.
        // Without response_type, GitHub uses its default browser flow and
        // returns the token in the URL fragment (#access_token=...) anyway,
        // which is exactly what the handler below reads. Do not re-add it.
        var u = 'https://github.com/login/oauth/authorize' +
          '?client_id=' + encodeURIComponent(normalizeAppId(appId) || FALLBACK_APP_ID) +
          '&redirect_uri=' + encodeURIComponent(redirect) +
          '&scope=' + encodeURIComponent(scope || 'repo public_repo') +
          '&state=' + encodeURIComponent(nonce);
        location.replace(u);
      }

      // Verify the state parameter echoed back by GitHub matches the one we
      // stored. If it doesn't, treat the token as untrusted and ignore it.
      function verifyState() {
        var expected = '';
        try { expected = sessionStorage.getItem('iep-oauth-state') || ''; } catch (e) {}
        if (!expected) return true; // no stored state (e.g. fresh tab) — accept to avoid blocking login
        var m = /[?&#]state=([^&]+)/.exec(location.href);
        if (!m) return false;
        var got = decodeURIComponent(m[1]);
        try { sessionStorage.removeItem('iep-oauth-state'); } catch (e) {}
        return got === expected;
      }

      // If the Worker bounced us back here asking for the implicit flow
      // (?iep_login=implicit), kick off GitHub's authorize page directly —
      // WITHOUT a sessionStorage state check. In this bounce scenario the
      // state was generated in Decap's popup window (or by the Worker), so
      // it cannot be verified against this tab's storage. We still pass the
      // original state along so any downstream code can see it, but we do
      // NOT require it to match sessionStorage.
      if (/[?&]iep_login=implicit/.test(location.search)) {
        var trustedId = '';
        var origState = '';
        try {
          var qs = new URLSearchParams(location.search);
          trustedId = qs.get('iep_client_id') || '';
          origState = qs.get('state') || '';
        } catch (e) {}
        history.replaceState(null, '', location.pathname); // clean the URL first
        // Build the authorize URL manually (no verifyState on return).
        var redirect = location.origin + location.pathname;
        var u = 'https://github.com/login/oauth/authorize' +
          '?client_id=' + encodeURIComponent(normalizeAppId(trustedId) || FALLBACK_APP_ID) +
          '&redirect_uri=' + encodeURIComponent(redirect) +
          '&scope=' + encodeURIComponent('repo public_repo') +
          (origState ? '&state=' + encodeURIComponent(origState) : '');
        location.replace(u);
        return;
      }

      // Deliver a token to Decap. The CMS listens for *object* messages of
      // shape { type: 'authorization:github:success', payload: { token } }
      // (decap-cms 3.x uses window.postMessage with JSON objects; older docs
      // show colon-strings). Send BOTH formats so either version works.
      function deliverToken(token) {
        var obj = { type: 'authorization:github:success', payload: JSON.stringify({ token: token }) };
        var str = 'authorization:github:success:' + JSON.stringify({ token: token });
        var tries = 0;
        var iv = setInterval(function () {
          try {
            window.postMessage(obj, location.origin);
            window.postMessage(str, location.origin);
          } catch (e) {}
          if (++tries > 40) clearInterval(iv);
        }, 150);
      }

      // 1) Returning from GitHub with a token in the fragment?
      var m = /[?&#]access_token=([^&]+)/.exec(location.href);
      if (m) {
        if (!verifyState()) {
          // State mismatch — ignore this token entirely (possible CSRF or a
          // stale redirect). Clean the URL so the page can boot normally and
          // the user can simply click login again.
          history.replaceState(null, '', location.pathname);
        } else {
        var token = decodeURIComponent(m[1]);
        history.replaceState(null, '', location.pathname + location.search); // clean URL
        // Keep a copy so later visits don't need to re-login until GitHub expires it.
        try { localStorage.setItem('iep-oauth-token', token); } catch (e) {}
        window.addEventListener('message', function (ev) {
          var d = ev.data;
          if (typeof d === 'string' ? d === 'authorizing:github' : (d && d.type === 'authorizing:github')) {
            deliverToken(token);
          }
        });
        setTimeout(function () { deliverToken(token); }, 300);
        setTimeout(function () { deliverToken(token); }, 1500);
        }
        return;
      }

      // 2) Otherwise intercept the login popup once decap-cms.js is loaded.
      var origOpen = window.open;
      window.open = function (url) {
        try {
          var s = String(url || '');
          // Intercept ANY authorize popup: our Worker proxy (/oauth) or a direct
          // github.com/login/oauth/authorize popup opened by Decap itself.
          if (s.indexOf(WORKER_BASE + '/oauth') === 0 || s.indexOf('github.com/login/oauth/authorize') !== -1) {
            // Route through the Worker with flow=implicit: the Worker knows the
            // ONLY correct client id (its GITHUB_OAUTH_ID variable, which also
            // matches the OAuth App's registered callback URL). It bounces us
            // back to /admin/?iep_login=implicit&iep_client_id=... and step (1)
            // above starts GitHub's authorize page with that trusted id. This
            // removes every hardcoded/stale app_id from the critical path —
            // a mismatched client id was what made GitHub show its 404 page.
            var target = WORKER_BASE + '/oauth?flow=implicit';
            var st = /[?&]state=([^&]+)/.exec(s);
            if (st) target += '&state=' + st[1];
            location.replace(target);
            return null; // suppress the popup that would hang
          }
        } catch (e) {}
        return origOpen.apply(window, arguments);
      };

      // 3) If a valid cached token exists, replay it immediately on load so
      //    the CMS restores the session without any redirect at all.
      try {
        var cached = localStorage.getItem('iep-oauth-token');
        if (cached) {
          window.addEventListener('message', function (ev) {
            var d = ev.data;
            if (typeof d === 'string' ? d === 'authorizing:github' : (d && d.type === 'authorizing:github')) {
              deliverToken(cached);
            }
          });
          setTimeout(function () { deliverToken(cached); }, 600);
        }
      } catch (e) {}

      // 4) Safety net: if Decap bypasses window.open and navigates THIS tab
      //    (or a popup it opened) straight to github.com/login/oauth/authorize
      //    with a response_type parameter, GitHub shows its "Sorry about
      //    that…" 404 page — that is exactly the hang we saw ("Completing
      //    sign-in…" forever). This capture-phase listener strips
      //    response_type from any authorize navigation before it happens, so
      //    GitHub always receives a URL it accepts.
      document.addEventListener('click', function (e) {
        try {
          var a = e.target && e.target.closest ? e.target.closest('a') : null;
          if (a && /login\/oauth\/authorize/.test(a.href || '')) {
            e.preventDefault();
            e.stopPropagation();
            startImplicitFlow(findAppId(), (window.cms && window.cms.backend && window.cms.backend.config && window.cms.backend.config.scope) || 'repo public_repo');
          }
        } catch (err) {}
      }, true);
      try {
        var origAssign = window.location.assign.bind(window.location);
        var origReplace = window.location.replace.bind(window.location);
        function sanitize(u) {
          u = String(u || '');
          if (/login\/oauth\/authorize/.test(u) && /[?&]response_type=/.test(u)) {
            return u.replace(/[?&]response_type=[^&#]*/g, '').replace(/\?&/, '?').replace(/\?$/, '');
          }
          return u;
        }
        window.location.assign = function (u) { return origAssign(sanitize(u)); };
        window.location.replace = function (u) { return origReplace(sanitize(u)); };
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Shown while decap-cms.js downloads; replaced by the CMS once it boots. -->
  <div id="iep-boot">
    <img src="/images/logo.png" alt="Innovation Earth Projects logo" />
    <div class="spinner" aria-hidden="true"></div>
    <div>Loading Admin&hellip;</div>
    <div class="sub" id="iep-boot-sub">If this message stays for more than a few seconds, the CMS script may be blocked by an ad blocker or your network. Disable it for this page and refresh.</div>
  </div>

  <script>
    // Hide the splash as soon as Decap takes over the page.
    (function () {
      var done = false;
      function hide() {
        if (done) return;
        done = true;
        var b = document.getElementById('iep-boot');
        if (b) b.remove();
      }
      var check = setInterval(function () {
        if (document.querySelector('.nc-app-container, [id^="nc-"]')) { clearInterval(check); hide(); }
      }, 100);
      setTimeout(function () { clearInterval(check); }, 20000);
      window.addEventListener('load', function () { setTimeout(hide, 3000); });
    })();

    // --- OAuth popup resilience -------------------------------------------
    // Decap opens a popup for GitHub login and waits for a postMessage from
    // it. Some browsers (or "block popups" settings / strict tracking
    // protection) block the popup, which leaves the admin page spinning
    // forever after clicking "Login with GitHub". This shim detects that and:
    //   1) shows a clear hint telling you to allow popups for this page, and
    //   2) offers a same-tab fallback that completes login without a popup.
    (function () {
      var warned = false;
      function showHint() {
        if (warned) return;
        // Only relevant while the CMS is sitting on the login screen.
        if (!document.querySelector('[class*="page-logo"], .nc-login-button-container')) return;
        warned = true;
        var box = document.createElement('div');
        box.id = 'iep-oauth-hint';
        box.style.cssText =
          'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99999;' +
          'max-width:480px;background:#232a33;color:#e6e9ee;border:1px solid #35d0ba;' +
          'border-radius:10px;padding:14px 18px;font:400 13px/1.5 system-ui,sans-serif;text-align:center;';
        box.innerHTML =
          'Popup blocked? Allow popups for this page and try again, or use the ' +
          '<a href="#" id="iep-oauth-direct" style="color:#7dd3c0;font-weight:600">direct sign-in link</a>. ' +
          '<span id="iep-oauth-close" style="margin-left:12px;cursor:pointer;color:#9aa4b2">\u2715</span>';
        document.body.appendChild(box);
        // Direct link: same authorize URL Decap's popup would open (redirect flow).
        // The Worker callback page detects the missing opener and bounces back here.
        var base = (window.DECAP_PROXY_BASE || 'https://decap-proxy.ykminmin8654.workers.dev/api/v1/github');
        document.getElementById('iep-oauth-direct').addEventListener('click', function (e) {
          e.preventDefault();
          location.href = base + '/oauth?state=' + encodeURIComponent(location.origin + '/admin/');
        });
        document.getElementById('iep-oauth-close').addEventListener('click', function () {
          box.remove(); warned = false;
        });
      }
      // Watch for a click on the login button; if no popup materialized in 1.5s, hint.
      document.addEventListener('click', function (e) {
        var t = e.target;
        while (t && t !== document.body) {
          if (/login|github/i.test(t.className || '') || /github/i.test((t.textContent || '').toLowerCase())) {
            var origOpen = window.open;
            var opened = false;
            window.open = function () { opened = true; return origOpen.apply(window, arguments); };
            setTimeout(function () {
              window.open = origOpen;
              if (!opened) showHint();
            }, 1500);
            break;
          }
          t = t.parentNode;
        }
      }, true);
      // Also surface the hint if the user returns to a tab still stuck at login.
      setInterval(function () {
        if (sessionStorage.getItem('iep-oauth-popup-blocked') === '1') showHint();
      }, 4000);
    })();
  </script>

  <!-- Multiple CDNs: if unpkg is blocked/slow, jsDelivr takes over. -->
  <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"
          onerror="(function(){var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/decap-cms@^3.3.3/dist/decap-cms.js';s.onerror=function(){var sub=document.getElementById('iep-boot-sub');if(sub){sub.innerHTML='Could not load the CMS from any CDN. Check your connection or ad blocker, then refresh.';}};document.body.appendChild(s);})();"></script>
</body>
</html>
