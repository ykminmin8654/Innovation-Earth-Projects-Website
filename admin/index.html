<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Innovation Earth Projects</title>
  <meta name="robots" content="noindex" />
  <style>
    body { margin: 0; background: #171b21; }
    #iep-boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #e6e9ee; background: #171b21; text-align: center; padding: 24px;
      z-index: 9999;
    }
    #iep-boot img { width: 72px; height: 72px; object-fit: contain; }
    #iep-boot .sub { font-weight: 400; font-size: 13px; color: #9aa4b2; max-width: 420px; }
    #iep-boot a { color: #7dd3c0; }
    #iep-boot button {
      background: #35d0ba; color: #0d1117; border: 0; border-radius: 8px;
      padding: 10px 18px; font: 600 14px system-ui, sans-serif; cursor: pointer;
    }
    .spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid #2c333d; border-top-color: #35d0ba;
      animation: iep-spin 0.9s linear infinite;
    }
    @keyframes iep-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>

  <!-- =====================================================================
    LOGIN SHIM v2 — full-page redirect flow (no popups, no postMessage).

    How login works now:
      1. User clicks "Login with GitHub". Decap opens a popup that goes to
         the Worker /oauth route -> GitHub authorize -> back to Worker
         /callback, which exchanges the code for a token server-side and
         then does: location.replace('/admin/#iep_at=<token>').
      2. This shim ALSO watches for the token arriving in this tab's URL
         fragment (#iep_at or #access_token) — the same-tab path — and
         handles it before Decap boots.
      3. The token is stashed in localStorage under 'iep-oauth-token' and
         seeded into every auth-store key Decap may read, so whichever
         storage format its installed version uses finds a valid session.
      4. On EVERY load, if a stashed token exists, we pre-seed the store
         BEFORE loading decap-cms.js so the app boots already logged-in.
      5. If the popup handshake ever fails again, the user can simply
         re-run the login link shown on the boot screen — it completes in
         THIS tab via full-page redirects (popup blockers can't stop it).

    No response_type param is ever sent (GitHub 404s on it), and state is
    never left empty (GitHub 404s on blank state=).
  ====================================================================== -->
  <script>
    (function () {
      var WORKER_BASE = 'https://decap-proxy.ykminmin8654.workers.dev/api/v1/github';
      var CLIENT_ID   = 'Iv23liYfJrQsBnnhUgVp'; // fallback only; Worker has its own copy
      var ADMIN_URL   = location.origin + '/admin/';

      function stashToken(tok) {
        try { localStorage.setItem('iep-oauth-token', tok); } catch (e) {}
        seedStores(tok);
      }

      // Seed every plausible Decap/Netlify-identity auth-store key so the
      // installed CMS version finds the session regardless of its naming.
      function seedStores(tok) {
        var payload = JSON.stringify({ access_token: tok, token_type: 'bearer' });
        var keys = [
          'netlify-github:' + ADMIN_URL + 'config.yml',
          'github:' + ADMIN_URL + 'config.yml',
          'localStorageKey:/config',
          'decap-github:' + ADMIN_URL,
          'decap-github:' + location.origin + '/admin/'
        ];
        for (var i = 0; i < keys.length; i++) {
          try { localStorage.setItem(keys[i], payload); } catch (e) {}
        }
        // Older netlify-identity-widget format used by some decap builds:
        try {
          localStorage.setItem('wp-github-auth', payload);
          localStorage.setItem('gotrue.site-' + location.host, payload);
        } catch (e) {}
      }

      function cleanUrl() {
        // Strip token fragments/query params from the address bar without reloading.
        try { history.replaceState(null, '', ADMIN_URL); } catch (e) {}
      }

      // ---- A) Token already present in THIS tab's URL? (same-tab return)
      var mAt = /[?&#]iep_at=([^&#]+)/.exec(location.href);
      var mAc = /[?&#]access_token=([^&#]+)/.exec(location.href);
      var incoming = mAt ? decodeURIComponent(mAt[1]) : (mAc ? decodeURIComponent(mAc[1]) : '');
      if (incoming) {
        stashToken(incoming);
        cleanUrl();
      } else {
        // ---- B) Stashed token from an earlier popup completion?
        var stashed = '';
        try { stashed = localStorage.getItem('iep-oauth-token') || ''; } catch (e) {}
        if (stashed && !/[?&#]iep_error=/.test(location.href)) {
          seedStores(stashed);
        }
      }

      // ---- C) Popup takeover: if Decap opens a popup toward the Worker/GitHub,
      // let it run there untouched. But if the popup dies/blocks, offer a
      // same-tab link. We detect blocked popups by watching for window.open
      // returning null while attempting login.
      var origOpen = window.open;
      window.open = function (url, name, features) {
        try {
          var u = String(url || '');
          if (/workers\.dev|github\.com\/login\/oauth/.test(u)) {
            var w = origOpen.call(window, url, name, features);
            if (!w) {
              // Popup blocked -> complete login in this tab instead.
              showBlockedNotice(u);
              return w;
            }
            return w;
          }
        } catch (e) {}
        return origOpen.call(window, url, name, features);
      };

      function showBlockedNotice(targetUrl) {
        var el = document.getElementById('iep-boot');
        if (!el) return;
        var note = document.createElement('div');
        note.className = 'sub';
        note.innerHTML = 'Popup was blocked. <a id="iep-direct" href="' + targetUrl + '">Sign in here instead →</a>';
        el.appendChild(note);
        document.getElementById('iep-direct').addEventListener('click', function () {
          // Full-page login in this tab; after GitHub approval the Worker
          // lands us back on /admin/#iep_at=<token>, handled by section A.
          location.href = targetUrl;
        });
      }

      // Expose tiny helper for the CMS-less fallback link below.
      window.__iepLoginUrl = WORKER_BASE + '/oauth';
    })();
  </script>
</head>
<body>
  <div id="iep-boot">
    <img src="/images/logo.png" alt="Innovation Earth Projects logo" />
    <div>Loading Admin…</div>
    <div class="sub">Content management for Innovation Earth Projects.</div>
    <button id="iep-fallback" style="display:none">Sign in with GitHub</button>
  </div>

  <script>
    // If the CMS bundle takes too long (CDN hiccup), surface a direct
    // same-tab sign-in button so the page is never a dead end.
    setTimeout(function () {
      var btn = document.getElementById('iep-fallback');
      var boot = document.getElementById('iep-boot');
      if (!btn || !boot) return;
      var cmsUp = !!document.querySelector('.nc-app, .css-1u4gftf, #nc-root');
      if (!cmsUp) {
        btn.style.display = '';
        btn.onclick = function () { location.href = window.__iepLoginUrl || ''; };
      }
    }, 6000);
  </script>

  <script src="https://unpkg.com/decap-cms@^3.8.0/dist/decap-cms.js"></script>
  <script>
    // After boot, hide splash when CMS renders; clear stale token on logout click.
    (function () {
      var tries = 0;
      var iv = setInterval(function () {
        tries++;
        var root = document.querySelector('#nc-root, .nc-app');
        if (root && root.children.length > 0) {
          clearInterval(iv);
          var el = document.getElementById('iep-boot');
          if (el) el.remove();
        } else if (tries > 120) {
          clearInterval(iv); // 12s: leave splash + fallback button visible
        }
      }, 100);

      // Logout hygiene: remove stashed token when user logs out.
      document.addEventListener('click', function (ev) {
        var t = ev.target && ev.target.textContent ? ev.target.textContent.trim().toLowerCase() : '';
        if (t === 'log out' || t === 'logout') {
          try { localStorage.removeItem('iep-oauth-token'); } catch (e) {}
        }
      }, true);
    })();
  </script>
</body>
</html>
