<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin · Innovation Earth Projects</title>
  <style>
    :root { --teal: #0f766e; --ink: #0f172a; --muted: #64748b; --bg: #f8fafc; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; display: grid; place-items: center; }
    .gate { width: min(400px, 92vw); background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 34px 30px; box-shadow: 0 12px 40px rgba(15, 23, 42, .08); text-align: center; }
    .gate img { width: 64px; height: 64px; object-fit: contain; margin-bottom: 14px; }
    .gate h1 { font-size: 1.3rem; margin-bottom: 6px; }
    .gate p { color: var(--muted); font-size: .9rem; margin-bottom: 20px; line-height: 1.5; }
    .gate input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 1rem; margin-bottom: 12px; }
    .gate input:focus { outline: 2px solid var(--teal); border-color: transparent; }
    .gate button { width: 100%; padding: 12px 14px; border: 0; border-radius: 10px; background: var(--teal); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .gate button:hover { filter: brightness(1.08); }
    .err { color: #b91c1c; font-size: .85rem; margin-top: 10px; min-height: 1.2em; }
    .hint { font-size: .75rem; color: #94a3b8; margin-top: 16px; }
    .hidden { display: none !important; }
    #cms-root { position: fixed; inset: 0; }
  </style>
</head>
<body>
  <!-- Password gate: verified server-side by the Worker (key never exposed). -->
  <div class="gate" id="gate">
    <img src="/images/logo.png" alt="Innovation Earth Projects logo" />
    <h1>Content Admin</h1>
    <p>Private area. Enter the admin key to unlock GitHub sign-in.</p>
    <form id="gate-form" autocomplete="off">
      <input type="password" id="admin-key" placeholder="Admin key" aria-label="Admin key" required />
      <button type="submit">Unlock &amp; continue</button>
    </form>
    <div class="err" id="gate-error"></div>
    <div class="hint">All verification happens on our server — this page never checks the key itself.</div>
  </div>

  <!-- Decap CMS loads here once signed in -->
  <div id="cms-root" class="hidden"></div>

  <script>
  /* GATE SHIM v3 — password-first flow.
     1. User types the admin key -> POSTed to the Worker (/gate) which compares
        it against ADMIN_KEY env var and returns a short-lived signed ticket.
     2. Ticket stored in sessionStorage and appended to every OAuth URL so the
        Worker's /oauth route refuses logins without a valid ticket.
     3. Token handoff arrives via URL FRAGMENT (#iep_at=...) — fragments are
        never sent to servers, so no GitHub Pages 404 is possible. */
  (function () {
    'use strict';
    var WORKER = 'https://decap-proxy.ykminmin8654.workers.dev';
    var TICKET_KEY = 'iep_admin_ticket';
    var TOKEN_KEY = 'iep_admin_token';

    function $(id) { return document.getElementById(id); }
    function showCms() { $('gate').classList.add('hidden'); $('cms-root').classList.remove('hidden'); }
    function showGate(msg) { $('gate').classList.remove('hidden'); $('cms-root').classList.add('hidden'); if (msg) $('gate-error').textContent = msg; }

    // --- Step 3 helper: seed token into every store format Decap may read ---
    function seedToken(tok) {
      try {
        var iso = new Date().toISOString();
        var auth = JSON.stringify({ token: tok });
        localStorage.setItem(TOKEN_KEY, tok);
        ['netlify-github-auth', 'netlify-cms-user', 'github-auth'].forEach(function (k) {
          try { localStorage.setItem(k, auth); } catch (e) {}
        });
        try {
          localStorage.setItem('netlify-cms-oauth', JSON.stringify({
            token: { accessToken: tok, expiresAt: iso },
            provider: 'github'
          }));
        } catch (e) {}
        sessionStorage.setItem('netlify-cms-access-token', JSON.stringify({ token: tok }));
      } catch (e) {}
    }

    function cleanUrl() {
      try { history.replaceState({}, '', location.pathname); } catch (e) {}
    }

    // --- On load: fragment token? stored token + ticket? ---
    var m = /[?&#]iep_at=([^&]+)/.exec(location.hash + location.search);
    if (m) { seedToken(decodeURIComponent(m[1])); cleanUrl(); startCms(); return; }
    var stored = null;
    try { stored = localStorage.getItem(TOKEN_KEY); } catch (e) {}
    if (stored && sessionStorage.getItem(TICKET_KEY)) { seedToken(stored); startCms(); return; }

    // --- Step 1: verify key with the Worker ---
    $('gate-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var key = $('admin-key').value.trim();
      if (!key) return;
      showGate('');
      fetch(WORKER + '/gate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: key })
      }).then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      }).then(function (res) {
        if (res.ok && res.j && res.j.ticket) {
          sessionStorage.setItem(TICKET_KEY, res.j.ticket);
          // --- Step 2: go through the Worker for GitHub sign-in ---
          location.href = WORKER + '/api/v1/github/oauth?ticket=' + encodeURIComponent(res.j.ticket);
        } else {
          showGate((res.j && res.j.error) || 'Wrong key — try again.');
        }
      }).catch(function () {
        showGate('Could not reach the server. Check your connection and retry.');
      });
    });

    // --- Start Decap CMS ---
    function startCms() {
      showCms();
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
      s.onload = function () {
        if (window.DecapCMS) { window.DecapCMS.init({ config: '/admin/config.yml' }); }
      };
      s.onerror = function () {
        var s2 = document.createElement('script');
        s2.src = 'https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js';
        s2.onload = function () { if (window.DecapCMS) window.DecapCMS.init({ config: '/admin/config.yml' }); };
        document.body.appendChild(s2);
      };
      document.body.appendChild(s);
    }
  })();
  </script>
</body>
</html>
