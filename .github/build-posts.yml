name: Build newsletter posts

on:
  push:
    branches: [main]
    paths:
      - 'newsletter/posts/**'
      - 'scripts/build-posts.js'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build posts.json
        run: node scripts/build-posts.js

      - name: Commit posts.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add newsletter/posts.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: rebuild newsletter posts.json"
          git push