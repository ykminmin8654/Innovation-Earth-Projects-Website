<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Newsletter — Innovation Earth Projects</title>
    
    <!-- Turnstile Script -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    
    <link rel="stylesheet" href="../shared/tokens.css" />
    <link rel="stylesheet" href="../shared/base.css" />
    <link rel="stylesheet" href="../shared/nav.css" />
    <link rel="stylesheet" href="./styles.css" />
</head>
<body data-page="newsletter">

    <div id="nav-mount"></div>

    <main>
        <!-- ... Existing page head and posts content ... -->

        <section class="section">
            <div class="container">
                <div class="subscribe">
                    <div class="subscribe__copy">
                        <span class="eyebrow">Stay in the loop</span>
                        <h2>Get new posts by email</h2>
                        <p>We send a short email when we publish something new — usually once or twice a month.</p>
                    </div>

                    <form class="subscribe__form" id="subscribe-form" novalidate>
                        <label class="visually-hidden" for="subscribe-email">Email address</label>
                        <input
                            type="email"
                            id="subscribe-email"
                            name="email"
                            class="subscribe__input"
                            placeholder="you@example.com"
                            required
                            autocomplete="email"
                        />

                        <!-- Turnstile Widget: Invisible for normal users -->
                        <div class="cf-turnstile" 
                             data-sitekey="0x4AAAAAAFMinCrsCsyi7S6X"
                             data-appearance="interaction-only"></div>

                        <button type="submit" class="btn btn--primary btn--glow">
                            Subscribe <i class="fas fa-arrow-right"></i>
                        </button>
                    </form>

                    <p class="subscribe__note" id="subscribe-note" aria-live="polite"></p>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-mount"></div>

    <script src="../shared/nav.js" defer></script>
    <script src="./script.js" defer></script>
</body>
</html>
